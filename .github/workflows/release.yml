name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "installer/**"
      - "scripts/**"
      - ".github/workflows/release.yml"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            throw "ISCC.exe not found after Inno Setup install"
          }

      - name: Fetch HIDMaestro.Core.dll
        shell: pwsh
        run: .\scripts\fetch-hidmaestro.ps1

      - name: Build installer
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          $version = "{0}-{1}" -f [DateTime]::UtcNow.ToString("yyyyMMdd"), $sha
          if ("${{ github.ref }}" -like "refs/tags/v*") {
            $version = "${{ github.ref_name }}".TrimStart("v")
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          .\scripts\package.ps1 -Version $version

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: s16n-hid-spoof-setup
          path: dist/s16n-hid-spoof-setup-*.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $versioned = Get-ChildItem dist -Filter "s16n-hid-spoof-setup-*.exe" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $versioned) { throw "Missing installer in dist\" }

          $asset = Join-Path dist "s16n-hid-spoof-setup.exe"
          Copy-Item $versioned.FullName $asset -Force

          $notes = "Windows x64 self-contained installer for s16n-hid-spoof $($env:VERSION).`n`nIncludes tray UI, per-slot Enabled, elevated logon autostart task option, and loopback HTTP control plane.`n`nCommit: $($env:GITHUB_SHA)`nRun: $($env:GITHUB_RUN_NUMBER)"

          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $tag = $env:GITHUB_REF_NAME
            $title = "s16n-hid-spoof $tag"
            gh release create $tag $asset --title $title --notes $notes
          }
          else {
            $tag = "latest"
            $title = "s16n-hid-spoof (latest)"
            gh release delete $tag --yes 2>$null
            gh api -X DELETE "repos/$($env:GITHUB_REPOSITORY)/git/refs/tags/$tag" 2>$null | Out-Null
            gh release create $tag $asset --title $title --notes $notes --latest
          }

          Write-Host "Download: https://github.com/$($env:GITHUB_REPOSITORY)/releases/download/$tag/s16n-hid-spoof-setup.exe"
